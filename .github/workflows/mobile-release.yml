# Production mobile review submission, held for manual release on both stores.
# GitHub Actions replaces Codemagic's
# "Flutter-Default Workflow" (app chessever-frontend-mobile).
#
# Manual runs only. Signing and store credentials live in the `release`
# environment, which only `stable` may use and which waits for a reviewer
# before a job receives them. Setup and the secret catalogue:
# docs/ci/github-actions-release.md.
name: Mobile release

on:
  workflow_dispatch:
    inputs:
      android:
        description: Build Android (App Bundle)
        type: boolean
        default: true
      ios:
        description: Build iOS (IPA)
        type: boolean
        default: true
      publish:
        description: Submit to Google Play production and App Store review (manual release only)
        type: boolean
        default: true
      managed_publishing_confirmed:
        description: I verified Google Play Managed publishing is ON for production ChessEver
        type: boolean
        default: false
      android_draft:
        description: Upload Android as a draft only, without review or release
        type: boolean
        default: false
      replace_pending_ios_review:
        description: Explicitly replace an earlier iOS review or approved manual hold (release stays manual)
        type: boolean
        default: false
      source_run:
        description: Reuse artifacts from this successful Mobile release run instead of rebuilding (optional)
        type: string
        default: ""
      source_sha:
        description: Full commit SHA of the source run (required when reusing artifacts)
        type: string
        default: ""
      upload_symbols:
        description: Keep R8 mapping and dSYMs as run artifacts (any signed-in GitHub user can download them)
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# Explicit bash adds `-o pipefail`, matching the `set -euo pipefail` the
# Codemagic scripts ran under.
defaults:
  run:
    shell: bash

env:
  # Public values compiled into the app (non-secure variables in Codemagic).
  CHESSEVER_CLOUDFLARE_API_BASE: ${{ vars.CHESSEVER_CLOUDFLARE_API_BASE }}
  GOOGLE_WEB_CLIENT_ID: ${{ vars.GOOGLE_WEB_CLIENT_ID }}
  GOOGLE_IOS_CLIENT_ID: ${{ vars.GOOGLE_IOS_CLIENT_ID }}
  ANALYSIS_API_BASE: https://chessever-analysis.young-sun-69a8.workers.dev

jobs:
  preflight:
    name: Verify release request
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require stable and a manual publishing hold
        env:
          RELEASE_REF: ${{ github.ref }}
          BUILD_ANDROID: ${{ inputs.android }}
          BUILD_IOS: ${{ inputs.ios }}
          SUBMIT: ${{ inputs.publish }}
          MANAGED_PUBLISHING_CONFIRMED: ${{ inputs.managed_publishing_confirmed }}
          ANDROID_DRAFT: ${{ inputs.android_draft }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/stable ]; then
            echo '::error::Mobile releases must run from stable.'
            exit 1
          fi
          if [ "$BUILD_ANDROID" != true ] && [ "$BUILD_IOS" != true ]; then
            echo '::error::Select at least one platform.'
            exit 1
          fi
          if [ "$SUBMIT" = true ] && [ "$BUILD_ANDROID" = true ] && [ "$ANDROID_DRAFT" != true ] && [ "$MANAGED_PUBLISHING_CONFIRMED" != true ]; then
            echo '::error::Verify Managed publishing is ON in Google Play Publishing overview before submitting Android.'
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test store submission safeguards
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'

  android:
    name: Android App Bundle
    needs: preflight
    if: inputs.android
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    concurrency:
      group: mobile-release-android
      cancel-in-progress: false
    env:
      JAVA_TOOL_OPTIONS: -Xmx10g
      ANDROID_KEY_ALIAS: my-key-alias
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free disk space
        if: inputs.source_run == ''
        background: true
        # The bundle alone is ~600 MB; the R8 and Gradle intermediates need
        # several GB more than a stock runner reliably has free.
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL

      - name: Set up Java 17
        background: true
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter (stable)
        if: inputs.source_run == ''
        background: true
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable

      - name: Set up Python
        if: inputs.publish
        background: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Wait for build toolchains
        wait-all:

      - name: Install store CLI tools
        if: inputs.publish
        background: true
        # 0.70.0, the release Codemagic's machines run, hash-locked with every
        # dependency because these tools handle the store credentials.
        run: python -m pip install --require-hashes -r scripts/ci/release-tools.txt

      - name: Install Android NDKs
        if: inputs.source_run == ''
        background: true
        # Codemagic pre-build step. The runner image ships neither version.
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;27.0.12077973" "ndk;28.2.13676358" > /dev/null

      - name: Wait for Android dependencies
        wait-all:

      - name: Write Firebase config and upload key
        if: inputs.source_run == ''
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          umask 077
          for name in GOOGLE_SERVICES_JSON_B64 ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 --decode > android/app/google-services.json
          keystore="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$keystore"
          # android/app/build.gradle.kts signs release builds from this
          # git-ignored file. Backslashes are escapes in .properties values.
          {
            echo "storeFile=$keystore"
            echo "storePassword=${ANDROID_KEYSTORE_PASSWORD//\\/\\\\}"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=${ANDROID_KEY_PASSWORD//\\/\\\\}"
          } > android/key.properties

      - name: Build App Bundle
        timeout-minutes: 20
        if: inputs.source_run == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          SENTRY_FLUTTER: ${{ secrets.SENTRY_FLUTTER }}
          AMPLITUDE: ${{ secrets.AMPLITUDE }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          APPSFLYER_DEV_KEY: ${{ secrets.APPSFLYER_DEV_KEY }}
        run: bash scripts/ci/mobile_flutter_build.sh appbundle

      - name: Download verified Android build
        if: inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        run: python3 scripts/ci/mobile_artifact_download.py android

      - name: Upload Android draft or submit for review
        timeout-minutes: 10
        if: inputs.publish
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          MANAGED_PUBLISHING_CONFIRMED: ${{ inputs.managed_publishing_confirmed }}
          ANDROID_SUBMIT_DRAFT: ${{ inputs.android_draft }}
        run: bash scripts/ci/mobile_store_submit.sh android

      - name: Keep App Bundle (build only)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-app-bundle
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 7
          if-no-files-found: error

      - name: Keep R8 mapping
        if: inputs.upload_symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-r8-mapping
          path: build/app/outputs/mapping/productionRelease/mapping.txt
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/upload-keystore.jks" android/key.properties android/app/google-services.json

  ios:
    name: iOS IPA
    needs: preflight
    if: inputs.ios
    runs-on: macos-26
    timeout-minutes: 30
    environment: release
    concurrency:
      group: mobile-release-ios
      cancel-in-progress: false
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode 26.6
        background: true
        # Codemagic's "latest" resolved to 26.6 (17F113) when this was ported.
        # Move deliberately; App Store Connect enforces a minimum SDK.
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Set up Flutter (stable)
        if: inputs.source_run == ''
        background: true
        uses: ./.github/actions/setup-flutter
        with:
          channel: stable

      - name: Set up Python
        background: true
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Wait for iOS toolchains
        wait-all:

      - name: Install store CLI tools
        # 0.70.0, the release Codemagic's machines run, hash-locked with every
        # dependency because these tools handle the signing credentials.
        run: python -m pip install --require-hashes -r scripts/ci/release-tools.txt

      - name: Write Firebase config and check entitlements
        if: inputs.source_run == ''
        env:
          GOOGLE_SERVICE_INFO_PLIST_B64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_B64 }}
        run: |
          if [ -z "${GOOGLE_SERVICE_INFO_PLIST_B64:-}" ]; then
            echo "::error::GOOGLE_SERVICE_INFO_PLIST_B64 is not set"
            exit 1
          fi
          printf '%s' "$GOOGLE_SERVICE_INFO_PLIST_B64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist
          aps_env=$(/usr/libexec/PlistBuddy -c "Print :aps-environment" ios/Runner/RunnerRelease.entitlements)
          if [ "$aps_env" != "production" ]; then
            echo "::error::RunnerRelease.entitlements aps-environment is '$aps_env' (expected 'production')"
            exit 1
          fi

      - name: Set up code signing
        if: inputs.source_run == ''
        # Same commands Codemagic ran: fetch the App Store certificate and
        # profiles for com.chessever.app (and its extension bundle IDs), then
        # point the Xcode project at them.
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_KEY }}
        run: |
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not set"
              exit 1
            fi
          done
          keychain initialize --path "$RUNNER_TEMP/signing.keychain-db"
          app-store-connect fetch-signing-files com.chessever.app \
            --type IOS_APP_STORE \
            --platform IOS \
            --create
          keychain add-certificates --path "$RUNNER_TEMP/signing.keychain-db"
          xcode-project use-profiles --export-options-plist "$RUNNER_TEMP/export_options.plist"

      - name: Build IPA
        timeout-minutes: 20
        if: inputs.source_run == ''
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
          SENTRY_FLUTTER: ${{ secrets.SENTRY_FLUTTER }}
          AMPLITUDE: ${{ secrets.AMPLITUDE }}
          CLARITY_PROJECT_ID: ${{ secrets.CLARITY_PROJECT_ID }}
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          APPSFLYER_DEV_KEY: ${{ secrets.APPSFLYER_DEV_KEY }}
        run: bash scripts/ci/mobile_flutter_build.sh ipa --export-options-plist "$RUNNER_TEMP/export_options.plist"

      - name: Download verified iOS build
        if: inputs.source_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run }}
          SOURCE_COMMIT: ${{ inputs.source_sha }}
        run: python3 scripts/ci/mobile_artifact_download.py ios

      - name: Check IPA signing
        # Codemagic post-build check: the embedded profile must carry
        # production APNs or push notifications silently stop working.
        run: |
          ipa=(build/ios/ipa/*.ipa)
          check_dir="$RUNNER_TEMP/ipa_check"
          rm -rf "$check_dir"
          mkdir -p "$check_dir"
          unzip -q "${ipa[0]}" -d "$check_dir"
          profile="$RUNNER_TEMP/runner_profile.plist"
          security cms -D -i "$check_dir/Payload/Runner.app/embedded.mobileprovision" > "$profile"
          echo "Profile: $(/usr/libexec/PlistBuddy -c "Print :Name" "$profile")"
          app_id=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$profile")
          case "$app_id" in
            *.com.chessever.app) ;;
            *) echo '::error::The IPA is not signed for production ChessEver.'; exit 1 ;;
          esac
          echo "App ID:  $app_id"
          aps=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:aps-environment" "$profile")
          echo "APNs:    $aps"
          if [ "$aps" != "production" ]; then
            echo "::error::Embedded profile APNs is '$aps' (expected 'production')"
            exit 1
          fi

      - name: Submit to App Store review (manual release)
        timeout-minutes: 10
        if: inputs.publish
        env:
          REPLACE_PENDING_IOS_REVIEW: ${{ inputs.replace_pending_ios_review }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: bash scripts/ci/mobile_store_submit.sh ios

      - name: Keep IPA (build only)
        if: ${{ !inputs.publish }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          retention-days: 7
          if-no-files-found: error

      - name: Keep dSYMs
        if: inputs.upload_symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-dsyms
          path: build/ios/archive/Runner.xcarchive/dSYMs
          retention-days: 7
          if-no-files-found: error

      - name: Remove signing material
        if: always()
        run: |
          keychain delete --path "$RUNNER_TEMP/signing.keychain-db" || true
          keychain use-login || true
          rm -rf "$HOME/Library/Developer/Xcode/UserData/Certificates" ios/Runner/GoogleService-Info.plist
