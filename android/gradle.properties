org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Network timeout settings for CI stability
systemProp.http.connectionTimeout=180000
systemProp.http.socketTimeout=180000
systemProp.https.connectionTimeout=180000
systemProp.https.socketTimeout=180000

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# AGP 9 turned two R8 defaults on that AGP 8 left off, and 38.6.6 (the first
# release built with AGP 9.3) would not open on Android. Our keep rules and the
# plugins' consumer rules were written for the AGP 8 behaviour:
# - strictFullModeForKeepRules: a plain `-keep class X` no longer keeps X's
#   no-arg constructor, so SDKs that create classes by reflection at startup
#   (Firebase component registrars, plugin initializers) crash on launch.
# - optimizedResourceShrinking: strips resources looked up only by name.
# Keep the AGP 8 behaviour until the keep rules are audited against AGP 9.
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=false
